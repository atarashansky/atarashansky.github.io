function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64u(s){s=s.replace(/^#/,"").trim().replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return b64(s);}
async function unlock(kStr){
  const raw=b64u(kStr);
  if(raw.length!==32)throw new Error("len");
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
  const html=new TextDecoder().decode(pt);
  const doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title;
  document.head.querySelectorAll("style").forEach(e=>e.remove());
  doc.head.querySelectorAll("style").forEach(s=>document.head.appendChild(s.cloneNode(true)));
  document.body.innerHTML=doc.body.innerHTML;
}
(async()=>{
  const h=location.hash.slice(1).trim();
  if(h){
    try{await unlock(h);return;}catch(e){document.getElementById("err").style.display="block";}
  }
  const g=document.getElementById("gate");
  g.hidden=false;
  document.getElementById("f").addEventListener("submit",async e=>{
    e.preventDefault();
    try{
      const v=document.getElementById("k").value.trim();
      await unlock(v);
      history.replaceState(null,"","#"+v.replace(/^#/,""));
    }catch(_){document.getElementById("err").style.display="block";}
  });
})();
</script></body></html>
